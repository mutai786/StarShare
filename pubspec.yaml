name: starshare
description: A file sharing application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.2
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1

  file_picker: ^10.3.1
  path_provider: ^2.1.5

  geolocator: ^12.0.0

  sqflite: ^2.4.2
  path: ^1.9.1

  cupertino_icons: ^1.0.8

  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/starshare_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true